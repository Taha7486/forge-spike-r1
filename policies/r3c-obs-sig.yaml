apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: r3c-obs-sig
spec:
  validationActions: [Audit]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 30
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchImageReferences:
    - glob: "docker.io/taha7486/forge-spike-r1*"
    - glob: "ghcr.io/taha7486/forge-spike-r1*"
  attestors:
    - name: forgeci
      cosign:
        keyless:
          identities:
            - subject: "https://github.com/Taha7486/forge-spike-r1/.github/workflows/r1-sign-golden.yml@refs/heads/main"
              issuer: "https://token.actions.githubusercontent.com"
  variables:
    - name: sigfail
      expression: >-
        images.containers.filter(i, verifyImageSignatures(i, [attestors.forgeci]) == 0)
  validations:
    - expression: variables.sigfail.size() == 0
      messageExpression: >-
        'no valid signature from the forge-spike-r1 signing workflow for: ' + variables.sigfail.join(', ')
