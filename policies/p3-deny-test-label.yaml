apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: p3-deny-test-label
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !has(object.metadata.labels) ||
        !('forge-test' in object.metadata.labels) ||
        object.metadata.labels['forge-test'] != 'deny-me'
      message: "pods labelled forge-test=deny-me are denied by p3-deny-test-label"
