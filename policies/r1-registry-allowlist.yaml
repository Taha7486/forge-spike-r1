apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: r1-registry-allowlist
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: default
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: images
      expression: >-
        object.spec.containers.map(c, c.image) +
        (has(object.spec.initContainers) ? object.spec.initContainers.map(c, c.image) : [])
  validations:
    - expression: >-
        variables.images.all(i,
          i.startsWith('docker.io/taha7486/forge-spike-r1') ||
          i.startsWith('ghcr.io/taha7486/forge-spike-r1'))
      message: "image is outside the allowed registries (docker.io/taha7486/forge-spike-r1, ghcr.io/taha7486/forge-spike-r1); denied by r1-registry-allowlist"
