name: r1-variants

on:
  workflow_dispatch:

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  variants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install Syft and Trivy (pinned, SHA-256 verified)
        run: |
          set -euo pipefail
          curl -sSfLO https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz
          echo "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3  syft_1.51.1_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf syft_1.51.1_linux_amd64.tar.gz syft
          curl -sSfLO https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  trivy_0.74.0_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf trivy_0.74.0_Linux-64bit.tar.gz trivy
          sudo install syft trivy /usr/local/bin/
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Log in to Docker Hub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
      - name: Build, push, sign and attest variants
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          GHCR="ghcr.io/${GITHUB_REPOSITORY,,}"
          HUB="docker.io/$DH_USER/forge-spike-r1"

          # Throwaway key for the keysigned variant; lives only in this job.
          COSIGN_PASSWORD="" cosign generate-key-pair
          export COSIGN_PASSWORD=""

          push() { # variant -> prints digest
            docker build -q --build-arg VARIANT="$1" -t "$GHCR:$1" -t "$HUB:$1" . >/dev/null
            docker push -q "$GHCR:$1" >/dev/null
            docker push -q "$HUB:$1" >/dev/null
            docker inspect --format '{{index .RepoDigests 0}}' "$GHCR:$1" | cut -d@ -f2
          }
          reports() { # digest -> sbom.cdx.json, vuln.json
            syft "$GHCR@$1" -o cyclonedx-json=sbom.cdx.json
            trivy image --format cosign-vuln --output vuln.json "$GHCR@$1"
          }

          # Sequential on purpose: the tag-schema fallback index is read-modify-write.
          {
            echo "## Variant digests"
            echo "| variant | digest |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # T3: pushed, never signed
          D=$(push unsigned)
          echo "| unsigned | \`$D\` |" >> "$GITHUB_STEP_SUMMARY"

          # T11: signed + vuln attestation, no SBOM
          D=$(push nosbom); reports "$D"
          for R in "$GHCR" "$HUB"; do
            cosign sign --yes "$R@$D"
            cosign attest --yes --type vuln --predicate vuln.json "$R@$D"
          done
          echo "| nosbom | \`$D\` |" >> "$GITHUB_STEP_SUMMARY"

          # T8: throwaway key, not keyless (signature only)
          D=$(push keysigned)
          for R in "$GHCR" "$HUB"; do
            cosign sign --yes --key cosign.key "$R@$D"
          done
          echo "| keysigned | \`$D\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "keysigned public key:"; cat cosign.pub

          # T16: attestations, no cosign sign
          D=$(push attestonly); reports "$D"
          for R in "$GHCR" "$HUB"; do
            cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$R@$D"
            cosign attest --yes --type vuln --predicate vuln.json "$R@$D"
          done
          echo "| attestonly | \`$D\` |" >> "$GITHUB_STEP_SUMMARY"
