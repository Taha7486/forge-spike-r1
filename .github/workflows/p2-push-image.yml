name: p2-push-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/p2-push-image.yml

permissions:
  contents: read
  packages: write

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push golden
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --build-arg VARIANT=golden -t "$IMAGE:golden" .
          docker push "$IMAGE:golden"
          echo "$IMAGE:golden"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:golden"
