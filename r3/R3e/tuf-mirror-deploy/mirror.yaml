apiVersion: v1
kind: Namespace
metadata: {name: tuf-mirror}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: tuf-nginx-conf, namespace: tuf-mirror}
data:
  default.conf: |
    server {
      listen 8080;
      root /tuf;
      default_type application/json;
      location = /timestamp.json { }
      location ~ ^/(\d+)\.root\.json$     { rewrite ^/(\d+)\.root\.json$ /root-$1.json break; }
      location ~ ^/(\d+)\.snapshot\.json$ { rewrite ^/(\d+)\.snapshot\.json$ /snapshot-$1.json break; }
      location ~ ^/(\d+)\.targets\.json$  { rewrite ^/(\d+)\.targets\.json$ /targets-$1.json break; }
      location /targets/ { rewrite ^/targets/(.*)$ /t-$1 break; }
      access_log /dev/stdout;
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: tuf-mirror, namespace: tuf-mirror}
spec:
  replicas: 1
  selector: {matchLabels: {app: tuf-mirror}}
  template:
    metadata: {labels: {app: tuf-mirror}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          volumeMounts:
            - {name: tuf, mountPath: /tuf}
            - {name: conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - {name: tuf, configMap: {name: tuf-files}}
        - {name: conf, configMap: {name: tuf-nginx-conf}}
---
apiVersion: v1
kind: Service
metadata: {name: tuf-mirror, namespace: tuf-mirror}
spec:
  selector: {app: tuf-mirror}
  ports: [{port: 80, targetPort: 8080}]
